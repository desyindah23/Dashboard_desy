<!doctype html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tambah Produk - Tugu Malang</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-stone-50 font-sans text-stone-800 min-h-screen flex flex-col justify-between">

  <header class="bg-white border-b border-stone-200 shadow-sm sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-6 py-4 flex flex-col md:flex-row justify-between items-center gap-4">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 bg-gradient-to-br from-amber-600 to-amber-800 rounded-xl flex items-center justify-center font-bold text-white shadow-md">TM</div>
        <div>
          <h1 class="font-extrabold text-stone-900 leading-tight">Admin Tugu Malang</h1>
          <span class="text-xs text-stone-500">Panel Pengelola Outlet</span>
        </div>
      </div>

      <nav class="flex items-center gap-2 bg-stone-100 p-1.5 rounded-2xl text-sm font-semibold">
        <a href="dashboard.html" class="text-stone-600 hover:text-stone-900 px-5 py-2 rounded-xl transition">📊 Dashboard</a>
        <a href="data.html" class="text-stone-600 hover:text-stone-900 px-5 py-2 rounded-xl transition">📦 Data Produk</a>
        <a href="form.html" class="bg-white text-stone-900 shadow-sm px-5 py-2 rounded-xl transition">➕ Input Produk</a>
      </nav>

      <div class="flex items-center gap-3">
        <span class="w-9 h-9 rounded-full bg-amber-600 text-white font-bold flex items-center justify-center text-sm shadow">A</span>
        <span class="text-sm font-bold text-stone-700 hidden sm:inline">Halo, Admin</span>
      </div>
    </div>
  </header>

  <main class="max-w-3xl w-full mx-auto px-6 py-10 flex-1">
    <div class="mb-8">
      <h2 class="text-3xl font-black text-stone-900">Form Tambah Produk Baru</h2>
      <p class="text-sm text-stone-500 mt-1">Masukkan informasi detail varian kue baru untuk ditambahkan ke daftar sistem.</p>
    </div>

    <div class="bg-white rounded-3xl border border-stone-200/80 shadow-sm p-8 md:p-10">
      <form action="data.html" method="GET" class="space-y-6">
        <div>
          <label class="block text-sm font-bold text-stone-700 mb-2">Nama Varian Produk</label>
          <input type="text" placeholder="Contoh: Brownies Tiramisu Keju" class="w-full px-4.5 py-3.5 rounded-2xl border border-stone-200 focus:outline-none focus:border-amber-600 text-sm bg-stone-50/50" required />
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
          <div>
            <label class="block text-sm font-bold text-stone-700 mb-2">Kategori Kue</label>
            <select class="w-full px-4.5 py-3.5 rounded-2xl border border-stone-200 focus:outline-none focus:border-amber-600 text-sm bg-stone-50/50">
              <option>Best Seller</option>
              <option>Khas Malang</option>
              <option>Regular</option>
            </select>
          </div>
          <div>
            <label class="block text-sm font-bold text-stone-700 mb-2">Harga (Rp)</label>
            <input type="number" placeholder="37000" class="w-full px-4.5 py-3.5 rounded-2xl border border-stone-200 focus:outline-none focus:border-amber-600 text-sm bg-stone-50/50" required />
          </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
          <div>
            <label class="block text-sm font-bold text-stone-700 mb-2">Jumlah Stok Awal (Kotak)</label>
            <input type="number" placeholder="20" class="w-full px-4.5 py-3.5 rounded-2xl border border-stone-200 focus:outline-none focus:border-amber-600 text-sm bg-stone-50/50" required />
          </div>
          <div>
            <label class="block text-sm font-bold text-stone-700 mb-2">Upload Foto Produk</label>
            <input type="file" class="w-full text-xs text-stone-500 file:mr-4 file:py-3 file:px-4 file:rounded-xl file:border-0 file:font-semibold file:bg-amber-50 file:text-amber-700 hover:file:bg-amber-100" />
          </div>
        </div>

        <div>
          <label class="block text-sm font-bold text-stone-700 mb-2">Deskripsi Singkat</label>
          <textarea rows="3" placeholder="Tuliskan deskripsi rasa dan keunggulan varian ini..." class="w-full px-4.5 py-3.5 rounded-2xl border border-stone-200 focus:outline-none focus:border-amber-600 text-sm bg-stone-50/50"></textarea>
        </div>

        <div class="pt-4 flex gap-4">
          <button type="submit" class="bg-amber-600 hover:bg-amber-700 text-white px-8 py-3.5 rounded-2xl font-bold text-sm shadow-md transition">
            Simpan Produk
          </button>
          <a href="data.html" class="bg-stone-100 hover:bg-stone-200 text-stone-700 px-8 py-3.5 rounded-2xl font-bold text-sm transition flex items-center justify-center">
            Batal
          </a>
        </div>
      </form>
    </div>
  </main>

  <footer class="bg-white border-t border-stone-200 py-6 text-center text-xs text-stone-500">
    <p>© 2026 Bolu Kukus & Brownies Tugu Malang — Admin Dashboard</p>
  </footer>

</body>
</html>
